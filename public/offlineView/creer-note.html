<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NafarBox - Nouvelle note</title>


    <style>

        body {

            margin: 0;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: #F8F3EB;

            color: #654321;

        }


        .container {

            max-width: 700px;

            margin: auto;

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

        }


        #chapitreNom {

            text-align: center;

            margin-bottom: 30px;

            font-size: 18px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        textarea {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #D2B48C;

            border-radius: 8px;

            font-size: 16px;

            resize: vertical;

            margin-bottom: 20px;

        }


        #recto {

            min-height: 80px;

        }


        .ck-editor {

            margin-bottom: 20px;

        }


        .ck-editor__editable_inline {

            min-height: 180px;

        }


        button {

            width: 100%;

            padding: 14px;

            border: 1px solid #D2B48C;

            border-radius: 8px;

            background: #654321;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.9;

        }


        .retour {

            display: inline-block;

            margin-bottom: 25px;

            color: #654321;

            text-decoration: none;

        }


        #message {

            margin-top: 20px;

            text-align: center;

        }

    </style>

</head>


<body>


<div class="container">


    <div id="breadcrumb"></div>


    <script>

    fetch("/offlineView/breadcrumb.html")

        .then(response => response.text())

        .then(html => {

            document.getElementById(
                "breadcrumb"
            ).innerHTML = html;


            if (
                typeof initialiserBreadcrumb ===
                "function"
            ) {

                initialiserBreadcrumb();

            }

        })

        .catch(error => {

            console.error(
                "❌ Erreur breadcrumb :",
                error
            );

        });

    </script>


    <a href="#"
       id="btnRetour"
       class="retour">

        ← Retour aux notes

    </a>


    <h1>
        ➕ Nouvelle note
    </h1>


    <div id="chapitreNom">

        Chargement du chapitre...

    </div>


    <form id="formNote">


        <!-- =====================================================
             RECTO
        ====================================================== -->

        <label for="recto">

            Recto

        </label>


        <textarea
            id="recto"
            placeholder="Écrivez le recto de la note..."></textarea>


        <!-- =====================================================
             VERSO
        ====================================================== -->

        <label for="verso">

            Verso

        </label>


        <textarea
            id="verso"
            placeholder="Écrivez le verso de la note..."></textarea>


        <button type="submit">

            💾 Enregistrer la note

        </button>


    </form>


    <div id="message"></div>


</div>



<!-- =============================================================
     CKEDITOR LOCAL
============================================================= -->

<script src="/offlineView/ckeditor/ckeditor.js"></script>



<!-- =============================================================
     BROUILLON
============================================================= -->

<script src="/offlineView/partials/brouillon-note.js"></script>



<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {


        /*
        |--------------------------------------------------------------------------
        | VARIABLES
        |--------------------------------------------------------------------------
        */

        let db = null;

        let versoEditor = null;


        /*
        |--------------------------------------------------------------------------
        | CHAPITRE
        |--------------------------------------------------------------------------
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const chapitreId =
            params.get('id');


        console.log(
            '📖 Chapitre :',
            chapitreId
        );


        /*
        |--------------------------------------------------------------------------
        | RETOUR
        |--------------------------------------------------------------------------
        */

        const btnRetour =
            document.getElementById(
                'btnRetour'
            );


        if (
            chapitreId &&
            btnRetour
        ) {

            btnRetour.href =
                '/offlineView/notes.html?id=' +
                chapitreId;

        }


        /*
        |--------------------------------------------------------------------------
        | CKEDITOR
        |--------------------------------------------------------------------------
        */

        if (
            typeof ClassicEditor ===
            'undefined'
        ) {

            console.error(
                '❌ CKEditor local introuvable'
            );

            return;

        }


        ClassicEditor
            .create(
                document.querySelector(
                    '#verso'
                )
            )
            .then(
                function (editor) {

                    versoEditor =
                        editor;


                    /*
                    |--------------------------------------------------------------------------
                    | Rendre l'éditeur disponible globalement
                    |--------------------------------------------------------------------------
                    */

                    window.versoEditor =
                        editor;


                    console.log(
                        '✅ CKEditor Verso prêt'
                    );


                    /*
                    |--------------------------------------------------------------------------
                    | Informer le système de brouillon
                    |--------------------------------------------------------------------------
                    */

                    if (
                        typeof window.initialiserBrouillon ===
                        'function'
                    ) {

                        window.initialiserBrouillon();

                    }

                }
            )
            .catch(
                function (error) {

                    console.error(
                        '❌ Erreur CKEditor :',
                        error
                    );

                }
            );


        /*
        |--------------------------------------------------------------------------
        | INDEXEDDB PRINCIPALE
        |--------------------------------------------------------------------------
        */

        const request =
            indexedDB.open(
                'nafarbox',
               7
            );


        request.onsuccess =
            function (event) {

                db =
                    event.target.result;


                console.log(
                    '✅ IndexedDB ouverte'
                );


                chargerChapitre();

            };


        request.onerror =
            function (event) {

                console.error(
                    '❌ Erreur IndexedDB :',
                    event.target.error
                );

            };


        /*
        |--------------------------------------------------------------------------
        | CHARGER LE CHAPITRE
        |--------------------------------------------------------------------------
        */

        function chargerChapitre() {


            if (!chapitreId) {

                document.getElementById(
                    'chapitreNom'
                ).textContent =
                    '❌ Aucun chapitre sélectionné.';

                return;

            }


            if (
                !db.objectStoreNames.contains(
                    'chapitres'
                )
            ) {

                console.error(
                    '❌ Store chapitres introuvable'
                );

                return;

            }


            const transaction =
                db.transaction(
                    'chapitres',
                    'readonly'
                );


            const store =
                transaction.objectStore(
                    'chapitres'
                );


            const chapitreRequest =
                store.get(
                    Number(chapitreId)
                );


            chapitreRequest.onsuccess =
                function () {

                    const chapitre =
                        chapitreRequest.result;


                    if (!chapitre) {

                        document.getElementById(
                            'chapitreNom'
                        ).textContent =
                            '❌ Chapitre introuvable.';

                        return;

                    }


                    document.getElementById(
                        'chapitreNom'
                    ).textContent =
                        '📖 ' +
                        chapitre.chapitre;

                };

        }


        /*
        |--------------------------------------------------------------------------
        | FORMULAIRE
        |--------------------------------------------------------------------------
        */

        const formNote =
            document.getElementById(
                'formNote'
            );


        formNote.addEventListener(
            'submit',
            async function (event) {

                event.preventDefault();


                /*
                |--------------------------------------------------------------------------
                | RECTO
                |--------------------------------------------------------------------------
                */

                const recto =
                    document
                        .getElementById(
                            'recto'
                        )
                        .value
                        .trim();


                /*
                |--------------------------------------------------------------------------
                | VERSO CKEDITOR
                |--------------------------------------------------------------------------
                */

                const verso =
                    versoEditor
                        ? versoEditor.getData()
                        : '';


                const message =
                    document.getElementById(
                        'message'
                    );


                /*
                |--------------------------------------------------------------------------
                | VALIDATION
                |--------------------------------------------------------------------------
                */

                if (!chapitreId) {

                    message.textContent =
                        '❌ Aucun chapitre sélectionné.';

                    return;

                }


                if (!recto) {

                    message.textContent =
                        '❌ Veuillez remplir le recto.';

                    return;

                }


                if (!verso.trim()) {

                    message.textContent =
                        '❌ Veuillez remplir le verso.';

                    return;

                }


                /*
                |--------------------------------------------------------------------------
                | INDEXEDDB
                |--------------------------------------------------------------------------
                */

                if (!db) {

                    message.textContent =
                        "❌ La base locale n'est pas encore prête.";

                    return;

                }


                /*
                |--------------------------------------------------------------------------
                | CRÉER LA NOTE
                |--------------------------------------------------------------------------
                */

                const note = {

                    local_id:
                        crypto.randomUUID(),

                    chapitre_id:
                        Number(
                            chapitreId
                        ),

                    recto:
                        recto,

                    verso:
                        verso,

                    nombre_revision:
                        0,

                    prochaine_revision:
                        new Date()
                            .toISOString()
                            .split('T')[0],

                    is_revised:
                        true,

                    is_synced:
                        false,

                    created_at:
                        new Date()
                            .toISOString()

                };


                console.log(
                    '📦 Note à enregistrer :',
                    note
                );


                /*
                |--------------------------------------------------------------------------
                | ENREGISTRER
                |--------------------------------------------------------------------------
                */

                try {

                    const transaction =
                        db.transaction(
                            'notes',
                            'readwrite'
                        );


                    const store =
                        transaction.objectStore(
                            'notes'
                        );


                    const addRequest =
                        store.add(
                            note
                        );


                    await new Promise(
                        function (
                            resolve,
                            reject
                        ) {

                            addRequest.onsuccess =
                                function () {

                                    resolve();

                                };


                            addRequest.onerror =
                                function (event) {

                                    reject(
                                        event
                                            .target
                                            .error
                                    );

                                };

                        }
                    );


                    console.log(
                        '✅ Note enregistrée dans IndexedDB'
                    );


                    /*
                    |--------------------------------------------------------------------------
                    | SUPPRIMER LE BROUILLON
                    |--------------------------------------------------------------------------
                    */

                    if (
                        typeof window.supprimerBrouillon ===
                        'function'
                    ) {

                        await window.supprimerBrouillon();

                    }


                    /*
                    |--------------------------------------------------------------------------
                    | MESSAGE
                    |--------------------------------------------------------------------------
                    */

                    message.textContent =
                        '✅ Note enregistrée hors connexion.';


                    /*
                    |--------------------------------------------------------------------------
                    | VIDER LE FORMULAIRE
                    |--------------------------------------------------------------------------
                    */

                    document
                        .getElementById(
                            'recto'
                        )
                        .value = '';


                    if (versoEditor) {

                        versoEditor.setData('');

                    }


                    /*
                    |--------------------------------------------------------------------------
                    | ACTUALISER LA LISTE DES BROUILLONS
                    |--------------------------------------------------------------------------
                    */

                    if (
                        typeof window.actualiserListeBrouillons ===
                        'function'
                    ) {

                        window.actualiserListeBrouillons();

                    }


                    /*
                    |--------------------------------------------------------------------------
                    | RETOUR
                    |--------------------------------------------------------------------------
                    */

                    setTimeout(
                        function () {

                            window.location.href =
                                '/offlineView/notes.html?id=' +
                                chapitreId;

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        '❌ Erreur enregistrement note :',
                        error
                    );


                    message.textContent =
                        "❌ Impossible d'enregistrer la note.";

                }

            }
        );

    });

</script>


</body>

</html>
