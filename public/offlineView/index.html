<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NafarBox - Mes matières</title>

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #F8F3EB;
            color: #654321;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #matieres {
            display: grid;
            gap: 15px;
        }

        .matiere {
            display: block;
            padding: 20px;
            background: white;
            border: 1px solid #D2B48C;
            border-radius: 10px;
            color: #654321;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .matiere:hover {
            background: #F8F3EB;
        }

        #message {
            text-align: center;
            margin-top: 20px;
        }

    </style>


    <script src="/offlineView/partials/liste-brouillons.js"></script>
<script src="/offlineView/partials/offline-matieres.js"></script>
</head>


<body>

    <!-- ========================================================= -->
    <!-- BREADCRUMB -->
    <!-- ========================================================= -->

    <div id="breadcrumb"></div>


    <!-- ========================================================= -->
    <!-- BROUILLONS -->
    <!-- ========================================================= -->

    <div id="listeBrouillonsContainer"></div>


    <!-- ========================================================= -->
    <!-- TITRE -->
    <!-- ========================================================= -->

    <h1>
        📚 Mes matières
    </h1>


    <!-- ========================================================= -->
    <!-- BOUTON / FORMULAIRE AJOUT MATIÈRE -->
    <!-- ========================================================= -->

    <div id="ajouterMatiereContainer"></div>


    <!-- ========================================================= -->
    <!-- LISTE DES MATIÈRES -->
    <!-- ========================================================= -->

    <div id="matieres"></div>


    <div id="message">
        Chargement...
    </div>



    <!-- ========================================================= -->
    <!-- CHARGER AJOUTER MATIÈRE -->
    <!-- ========================================================= -->

    <script>

        fetch(
            "/offlineView/ajouterMatiere.html"
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        "Erreur HTTP : " +
                        response.status
                    );

                }

                return response.text();

            }
        )

        .then(
            html => {

                const container =
                    document.getElementById(
                        "ajouterMatiereContainer"
                    );


                /*
                |--------------------------------------------------------------------------
                | Insérer le HTML
                |--------------------------------------------------------------------------
                */

                container.innerHTML =
                    html;


                /*
                |--------------------------------------------------------------------------
                | Exécuter les scripts
                |--------------------------------------------------------------------------
                */

                const scripts =
                    container.querySelectorAll(
                        "script"
                    );


                scripts.forEach(
                    function (oldScript) {

                        const newScript =
                            document.createElement(
                                "script"
                            );


                        /*
                        | Copier le contenu
                        */

                        if (
                            oldScript.textContent
                        ) {

                            newScript.textContent =
                                oldScript.textContent;

                        }


                        /*
                        | Copier un éventuel src
                        */

                        if (
                            oldScript.src
                        ) {

                            newScript.src =
                                oldScript.src;

                        }


                        document.body.appendChild(
                            newScript
                        );

                    }
                );

            }
        )

        .catch(
            error => {

                console.error(
                    "❌ Erreur chargement ajouterMatiere :",
                    error
                );

            }
        );

    </script>



    <!-- ========================================================= -->
    <!-- INDEXEDDB -->
    <!-- ========================================================= -->

    <script>

        const request =
            indexedDB.open(
                "nafarbox",
                8
            );


        /*
        |--------------------------------------------------------------------------
        | BASE OUVERTE
        |--------------------------------------------------------------------------
        */

        request.onsuccess =
            function (event) {

                const db =
                    event.target.result;


                /*
                |--------------------------------------------------------------------------
                | IMPORTANT
                |--------------------------------------------------------------------------
                | Rendre la connexion disponible aux autres scripts
                |--------------------------------------------------------------------------
                */

                window.offlineDB =
                    db;


                console.log(
                    "✅ IndexedDB ouverte"
                );


                console.log(
                    "📦 Base disponible pour les autres scripts"
                );


                /*
                |--------------------------------------------------------------------------
                | Charger les matières
                |--------------------------------------------------------------------------
                */

                chargerMatieres(
                    db
                );

            };


        /*
        |--------------------------------------------------------------------------
        | ERREUR
        |--------------------------------------------------------------------------
        */

        request.onerror =
            function (event) {

                console.error(
                    "❌ Erreur IndexedDB :",
                    event.target.error
                );


                document.getElementById(
                    "message"
                ).textContent =
                    "Impossible d'ouvrir la base locale.";

            };


        /*
        |--------------------------------------------------------------------------
        | RÉCUPÉRER LES MATIÈRES
        |--------------------------------------------------------------------------
        */

        function chargerMatieres(
            db
        )
        {

            const transaction =
                db.transaction(
                    "matieres",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "matieres"
                );


            const request =
                store.getAll();


            request.onsuccess =
                function ()
                {

                    const matieres =
                        request.result;


                    console.log(
                        "📚 Matières trouvées :",
                        matieres
                    );


                    afficherMatieres(
                        matieres
                    );

                };


            request.onerror =
                function (event)
                {

                    console.error(
                        "❌ Erreur lecture matières :",
                        event.target.error
                    );

                };

        }


        /*
        |--------------------------------------------------------------------------
        | AFFICHER LES MATIÈRES
        |--------------------------------------------------------------------------
        */

        function afficherMatieres(
            matieres
        )
        {

            const container =
                document.getElementById(
                    "matieres"
                );


            const message =
                document.getElementById(
                    "message"
                );


            container.innerHTML =
                "";


            /*
            |--------------------------------------------------------------------------
            | Aucune matière
            |--------------------------------------------------------------------------
            */

            if (
                matieres.length === 0
            ) {

                message.textContent =
                    "Aucune matière disponible hors connexion.";

                return;

            }


            /*
            |--------------------------------------------------------------------------
            | Nombre de matières
            |--------------------------------------------------------------------------
            */

            message.textContent =
                matieres.length +
                " matière(s) disponible(s).";


            /*
            |--------------------------------------------------------------------------
            | Parcourir
            |--------------------------------------------------------------------------
            */

            matieres.forEach(
                function (matiere)
                {

                    const lien =
                        document.createElement(
                            "a"
                        );


                    lien.className =
                        "matiere";


                    lien.textContent =
                        "📚 " +
                        matiere.matiere;


                    /*
                    |--------------------------------------------------------------------------
                    | ID matière
                    |--------------------------------------------------------------------------
                    */

                    lien.dataset.id =
                        matiere.id;


                    /*
                    |--------------------------------------------------------------------------
                    | Lien vers les chapitres
                    |--------------------------------------------------------------------------
                    */

                    lien.href =
                        "/offlineView/chapitres.html?id=" +
                        matiere.id;


                    container.appendChild(
                        lien
                    );

                }
            );

        }

    </script>



    <!-- ========================================================= -->
    <!-- BREADCRUMB -->
    <!-- ========================================================= -->

    <script>

        fetch(
            "/offlineView/breadcrumb.html"
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        "Erreur HTTP : " +
                        response.status
                    );

                }

                return response.text();

            }
        )

        .then(
            html => {

                document.getElementById(
                    "breadcrumb"
                ).innerHTML =
                    html;


                if (
                    typeof initialiserBreadcrumb ===
                    "function"
                ) {

                    initialiserBreadcrumb();

                }

            }
        )

        .catch(
            error => {

                console.error(
                    "❌ Erreur breadcrumb :",
                    error
                );

            }
        );

    </script>


</body>

</html>
