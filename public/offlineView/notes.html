<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NafarBox - Notes</title>

<style>

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #F8F3EB;
        color: #654321;
    }

    /* ========================================================= */
    /* EN-TÊTE MATIÈRE + CHAPITRE */
    /* ========================================================= */

    .entete {
        text-align: center;
        margin-bottom: 25px;
    }

    .matiere {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .chapitre {
        font-size: 18px;
        color: #8B6B45;
    }


    /* ========================================================= */
    /* NOTES */
    /* ========================================================= */

    #notes {
        display: grid;
        gap: 15px;
    }

    .note {
        display: block;
        padding: 20px;
        background: white;
        border: 1px solid #D2B48C;
        border-radius: 10px;
        color: #654321;
        text-decoration: none;
    }

    .note-recto {
        font-weight: bold;
        font-size: 18px;
    }

    .note-verso {
        margin-top: 10px;
    }


    /* ========================================================= */
    /* RETOUR */
    /* ========================================================= */

    .retour {
        display: inline-block;
        margin-bottom: 25px;
        color: #654321;
        text-decoration: none;
    }


    /* ========================================================= */
    /* MESSAGE */
    /* ========================================================= */

    #message {
        text-align: center;
        margin-top: 20px;
    }


    /* ========================================================= */
    /* AJOUTER UNE NOTE */
    /* ========================================================= */

    .ajouter {
        display: inline-block;
        padding: 10px 15px;
        margin-bottom: 20px;
        background: #654321;
        color: white;
        border-radius: 8px;
        text-decoration: none;
    }

    .ajouter:hover {
        opacity: 0.9;
    }

</style>


<!-- ========================================================= -->
<!-- FIL D'ARIANE -->
<!-- ========================================================= -->

<div id="breadcrumb"></div>


<!-- ========================================================= -->
<!-- RETOUR -->
<!-- ========================================================= -->

<a href="javascript:history.back()"
   class="retour">

    ← Retour

</a>


<!-- ========================================================= -->
<!-- EN-TÊTE -->
<!-- ========================================================= -->

<div class="entete">

    <div
        id="nomMatiere"
        class="matiere">

        📚 Chargement...

    </div>


    <div
        id="nomChapitre"
        class="chapitre">

        📖 Chargement...

    </div>

</div>


<!-- ========================================================= -->
<!-- AJOUTER UNE NOTE -->
<!-- ========================================================= -->

<a
    id="btnAjouterNote"
    href="#"
    class="ajouter">

    ➕ Ajouter une note

</a>


<!-- ========================================================= -->
<!-- TITRE -->
<!-- ========================================================= -->

<h2>
    📝 Notes
</h2>


<!-- ========================================================= -->
<!-- LISTE DES NOTES -->
<!-- ========================================================= -->

<div id="notes"></div>


<div id="message">
    Chargement...
</div>



<script>

    /*
    |--------------------------------------------------------------------------
    | Récupérer le chapitre dans l'URL
    |--------------------------------------------------------------------------
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const chapitreId =
        params.get('id');


    console.log(
        "📖 ID chapitre :",
        chapitreId
    );


    /*
    |--------------------------------------------------------------------------
    | Vérifier l'ID
    |--------------------------------------------------------------------------
    */

    if (!chapitreId) {

        document.getElementById(
            "message"
        ).textContent =
            "❌ Aucun chapitre sélectionné.";

    }


    /*
    |--------------------------------------------------------------------------
    | Ouvrir IndexedDB
    |--------------------------------------------------------------------------
    */

    const request =
        indexedDB.open(
            "nafarbox",
            8
        );


    request.onsuccess =
        function (event) {

            const db =
                event.target.result;


            console.log(
                "✅ IndexedDB ouverte"
            );


            /*
            |--------------------------------------------------------------------------
            | Charger le chapitre
            |--------------------------------------------------------------------------
            */

            chargerChapitre(
                db
            );


            /*
            |--------------------------------------------------------------------------
            | Charger les notes
            |--------------------------------------------------------------------------
            */

            chargerNotes(
                db
            );


            /*
            |--------------------------------------------------------------------------
            | Configurer le bouton
            |--------------------------------------------------------------------------
            */

            configurerBoutonAjouterNote(
                db
            );

        };


    request.onerror =
        function (event) {

            console.error(
                "❌ Erreur IndexedDB :",
                event.target.error
            );


            document.getElementById(
                "message"
            ).textContent =
                "❌ Impossible d'ouvrir la base locale.";

        };


    /*
    |--------------------------------------------------------------------------
    | Configurer le bouton Ajouter une note
    |--------------------------------------------------------------------------
    */

    function configurerBoutonAjouterNote(db)
    {

        const bouton =
            document.getElementById(
                "btnAjouterNote"
            );


        if (!bouton) {

            return;

        }


        /*
        |--------------------------------------------------------------------------
        | Lire l'utilisateur
        |--------------------------------------------------------------------------
        */

        const transactionUser =
            db.transaction(
                "user",
                "readonly"
            );


        const userStore =
            transactionUser.objectStore(
                "user"
            );


        const requestUser =
            userStore.getAll();


        requestUser.onsuccess =
            function () {

                const users =
                    requestUser.result;


                /*
                |--------------------------------------------------------------------------
                | Utilisateur introuvable
                |--------------------------------------------------------------------------
                */

                if (
                    !users ||
                    users.length === 0
                ) {

                    console.error(
                        "❌ Aucun utilisateur trouvé dans IndexedDB"
                    );


                    /*
                    | Sécurité :
                    | on ne laisse pas créer si le statut
                    | de l'utilisateur est inconnu.
                    */

                    bouton.removeAttribute(
                        "href"
                    );


                    bouton.onclick =
                        function (event) {

                            event.preventDefault();


                            alert(
                                "❌ Impossible de vérifier votre abonnement."
                            );


                            return false;

                        };


                    return;

                }


                const user =
                    users[0];


                console.log(
                    "👤 Utilisateur offline :",
                    user
                );


                console.log(
                    "🔐 is_subscribed :",
                    user.is_subscribed
                );


                /*
                |--------------------------------------------------------------------------
                | UTILISATEUR ABONNÉ
                |--------------------------------------------------------------------------
                */

                if (
                    Number(
                        user.is_subscribed
                    ) === 1
                ) {

                    bouton.href =
                        "/offlineView/creer-note.html?id=" +
                        chapitreId;


                    bouton.onclick =
                        null;


                    console.log(
                        "✅ Utilisateur abonné : création autorisée"
                    );


                    return;

                }


                /*
                |--------------------------------------------------------------------------
                | UTILISATEUR GRATUIT
                |--------------------------------------------------------------------------
                */

                const transactionNotes =
                    db.transaction(
                        "notes",
                        "readonly"
                    );


                const notesStore =
                    transactionNotes.objectStore(
                        "notes"
                    );


                const requestNotes =
                    notesStore.getAll();


                requestNotes.onsuccess =
                    function () {

                        const notes =
                            requestNotes.result;


                        const nombreNotes =
                            notes.length;


                        console.log(
                            "📝 Nombre total de notes locales :",
                            nombreNotes
                        );


                        /*
                        |--------------------------------------------------------------------------
                        | LIMITE ATTEINTE
                        |--------------------------------------------------------------------------
                        */

                        if (
                            nombreNotes >= 5
                        ) {

                            bouton.removeAttribute(
                                "href"
                            );


                            bouton.onclick =
                                function (event) {

                                    event.preventDefault();


                                    alert(
                                        "Vous avez atteint le nombre maximum de 5 notes par chapitre pour la version gratuite. passez à la version prémium pour une meilleure expérience  "
                                    );


                                    return false;

                                };


                            console.log(
                                "🆓 Limite de 5 notes atteinte"
                            );


                            return;

                        }


                        /*
                        |--------------------------------------------------------------------------
                        | ENCORE SOUS LA LIMITE
                        |--------------------------------------------------------------------------
                        */

                        bouton.href =
                            "/offlineView/creer-note.html?id=" +
                            chapitreId;


                        bouton.onclick =
                            null;


                        console.log(
                            "🆓 Version gratuite : création autorisée"
                        );

                    };


                requestNotes.onerror =
                    function (event) {

                        console.error(
                            "❌ Erreur lecture notes :",
                            event.target.error
                        );

                    };

            };


        requestUser.onerror =
            function (event) {

                console.error(
                    "❌ Erreur lecture utilisateur :",
                    event.target.error
                );

            };

    }


    /*
    |--------------------------------------------------------------------------
    | Charger le chapitre
    |--------------------------------------------------------------------------
    */

    function chargerChapitre(db)
    {

        const transaction =
            db.transaction(
                "chapitres",
                "readonly"
            );


        const store =
            transaction.objectStore(
                "chapitres"
            );


        const request =
            store.get(
                Number(chapitreId)
            );


        request.onsuccess =
            function ()
            {

                const chapitre =
                    request.result;


                if (!chapitre) {

                    console.error(
                        "❌ Chapitre introuvable :",
                        chapitreId
                    );


                    document.getElementById(
                        "nomChapitre"
                    ).textContent =
                        "📖 Chapitre introuvable";


                    return;

                }


                console.log(
                    "📖 Chapitre trouvé :",
                    chapitre
                );


                /*
                |--------------------------------------------------------------------------
                | Afficher le nom du chapitre
                |--------------------------------------------------------------------------
                */

                document.getElementById(
                    "nomChapitre"
                ).textContent =
                    "📖 " + chapitre.chapitre;


                /*
                |--------------------------------------------------------------------------
                | Charger maintenant la matière
                |--------------------------------------------------------------------------
                */

                chargerMatiere(
                    db,
                    chapitre.matiere_id
                );

            };


        request.onerror =
            function (event)
            {

                console.error(
                    "❌ Erreur lecture chapitre :",
                    event.target.error
                );

            };

    }


    /*
    |--------------------------------------------------------------------------
    | Charger la matière
    |--------------------------------------------------------------------------
    */

    function chargerMatiere(
        db,
        matiereId
    )
    {

        const transaction =
            db.transaction(
                "matieres",
                "readonly"
            );


        const store =
            transaction.objectStore(
                "matieres"
            );


        const request =
            store.get(
                Number(matiereId)
            );


        request.onsuccess =
            function ()
            {

                const matiere =
                    request.result;


                if (!matiere) {

                    console.error(
                        "❌ Matière introuvable :",
                        matiereId
                    );


                    document.getElementById(
                        "nomMatiere"
                    ).textContent =
                        "📚 Matière introuvable";


                    return;

                }


                console.log(
                    "📚 Matière trouvée :",
                    matiere
                );


                document.getElementById(
                    "nomMatiere"
                ).textContent =
                    "📚 " + matiere.matiere;

            };


        request.onerror =
            function (event)
            {

                console.error(
                    "❌ Erreur lecture matière :",
                    event.target.error
                );

            };

    }


    /*
    |--------------------------------------------------------------------------
    | Charger les notes du chapitre
    |--------------------------------------------------------------------------
    */

    function chargerNotes(db)
    {

        const transaction =
            db.transaction(
                "notes",
                "readonly"
            );


        const store =
            transaction.objectStore(
                "notes"
            );


        const index =
            store.index(
                "chapitre_id"
            );


        const request =
            index.getAll(
                Number(chapitreId)
            );


        request.onsuccess =
            function ()
            {

                const notes =
                    request.result;


                console.log(
                    "📝 Notes trouvées :",
                    notes
                );


                afficherNotes(
                    notes
                );

            };


        request.onerror =
            function (event)
            {

                console.error(
                    "❌ Erreur lecture notes :",
                    event.target.error
                );

            };

    }


    /*
    |--------------------------------------------------------------------------
    | Afficher les notes
    |--------------------------------------------------------------------------
    */

    function afficherNotes(notes)
    {

        const container =
            document.getElementById(
                "notes"
            );


        const message =
            document.getElementById(
                "message"
            );


        container.innerHTML = "";


        if (
            !notes ||
            notes.length === 0
        ) {

            message.textContent =
                "Aucune note disponible hors connexion.";


            return;

        }


        message.textContent =
            notes.length +
            " note(s) disponible(s).";


        notes.forEach(
            function (note)
            {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "note";


                div.innerHTML = `

                    <div class="note-recto">
                        ${note.recto}
                    </div>

                    <div class="note-verso">
                        ${note.verso}
                    </div>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }

</script>


<!-- ========================================================= -->
<!-- BREADCRUMB -->
<!-- ========================================================= -->

<script>

fetch(
    "/offlineView/breadcrumb.html"
)

    .then(
        response => {

            if (!response.ok) {

                throw new Error(
                    "Erreur HTTP : " +
                    response.status
                );

            }


            return response.text();

        }
    )

    .then(
        html => {

            document.getElementById(
                "breadcrumb"
            ).innerHTML =
                html;


            chargerBreadcrumb();

        }
    )

    .catch(
        error => {

            console.error(
                "❌ Erreur breadcrumb :",
                error
            );

        }
    );


/*
|--------------------------------------------------------------------------
| Charger le breadcrumb
|--------------------------------------------------------------------------
*/

function chargerBreadcrumb()
{

    const params =
        new URLSearchParams(
            window.location.search
        );


    const chapitreId =
        params.get("id");


    if (!chapitreId) {

        console.error(
            "❌ ID chapitre absent"
        );


        return;

    }


    /*
    |--------------------------------------------------------------------------
    | Ouvrir IndexedDB
    |--------------------------------------------------------------------------
    */

    const request =
        indexedDB.open(
            "nafarbox",
            8
        );


    request.onsuccess =
        function(event) {

            const db =
                event.target.result;


            /*
            |--------------------------------------------------------------------------
            | Récupérer le chapitre
            |--------------------------------------------------------------------------
            */

            const transaction =
                db.transaction(
                    "chapitres",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "chapitres"
                );


            const chapitreRequest =
                store.get(
                    Number(chapitreId)
                );


            chapitreRequest.onsuccess =
                function() {

                    const chapitre =
                        chapitreRequest.result;


                    if (!chapitre) {

                        console.error(
                            "❌ Chapitre introuvable"
                        );


                        return;

                    }


                    console.log(
                        "📖 Chapitre :",
                        chapitre
                    );


                    /*
                    |--------------------------------------------------------------------------
                    | Nom du chapitre
                    |--------------------------------------------------------------------------
                    */

                    document.getElementById(
                        "breadcrumbChapitre"
                    ).textContent =
                        "📖 " +
                        chapitre.chapitre;


                    /*
                    |--------------------------------------------------------------------------
                    | Lien vers le chapitre
                    |--------------------------------------------------------------------------
                    */

                    document.getElementById(
                        "breadcrumbChapitre"
                    ).href =
                        "/offlineView/notes.html?id=" +
                        chapitre.id;


                    /*
                    |--------------------------------------------------------------------------
                    | Matière
                    |--------------------------------------------------------------------------
                    */

                    chargerBreadcrumbMatiere(
                        db,
                        chapitre.matiere_id
                    );

                };

        };

}


/*
|--------------------------------------------------------------------------
| Charger la matière du breadcrumb
|--------------------------------------------------------------------------
*/

function chargerBreadcrumbMatiere(
    db,
    matiereId
)
{

    const transaction =
        db.transaction(
            "matieres",
            "readonly"
        );


    const store =
        transaction.objectStore(
            "matieres"
        );


    const request =
        store.get(
            Number(matiereId)
        );


    request.onsuccess =
        function()
        {

            const matiere =
                request.result;


            if (!matiere) {

                console.error(
                    "❌ Matière introuvable"
                );


                return;

            }


            console.log(
                "📚 Matière :",
                matiere
            );


            /*
            |--------------------------------------------------------------------------
            | Nom réel de la matière
            |--------------------------------------------------------------------------
            */

            document.getElementById(
                "breadcrumbMatiere"
            ).textContent =
                "📚 " +
                matiere.matiere;


            /*
            |--------------------------------------------------------------------------
            | Lien vers les chapitres
            |--------------------------------------------------------------------------
            */

            document.getElementById(
                "breadcrumbMatiere"
            ).href =
                "/offlineView/chapitres.html?id=" +
                matiere.id;

        };

}


/*
|--------------------------------------------------------------------------
| Récupérer utilisateur
|--------------------------------------------------------------------------
*/

function recupererUtilisateur(callback)
{

    /*
    |--------------------------------------------------------------------------
    | Ouvrir IndexedDB
    |--------------------------------------------------------------------------
    */

    const request =
        indexedDB.open(
            "nafarbox",
            8
        );


    request.onsuccess =
        function(event)
        {

            const db =
                event.target.result;


            const transaction =
                db.transaction(
                    "user",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "user"
                );


            const userRequest =
                store.getAll();


            userRequest.onsuccess =
                function()
                {

                    const users =
                        userRequest.result;


                    if (
                        users.length === 0
                    )
                    {

                        console.error(
                            "❌ Aucun utilisateur trouvé dans IndexedDB"
                        );


                        callback(null);


                        return;

                    }


                    const user =
                        users[0];


                    console.log(
                        "👤 Utilisateur offline :",
                        user
                    );


                    console.log(
                        "🔐 is_subscribed :",
                        user.is_subscribed
                    );


                    callback(
                        user
                    );

                };


            userRequest.onerror =
                function(event)
                {

                    console.error(
                        "❌ Erreur lecture utilisateur :",
                        event.target.error
                    );


                    callback(null);

                };

        };


    request.onerror =
        function(event)
        {

            console.error(
                "❌ Erreur ouverture IndexedDB :",
                event.target.error
            );


            callback(null);

        };

}

</script>
