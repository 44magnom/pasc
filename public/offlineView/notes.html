<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NafarBox - Notes</title>

<style>

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #F8F3EB;
        color: #654321;
    }

    /* En-tête matière + chapitre */

    .entete {
        text-align: center;
        margin-bottom: 25px;
    }

    .matiere {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .chapitre {
        font-size: 18px;
        color: #8B6B45;
    }

    #notes {
        display: grid;
        gap: 15px;
    }

    .note {
        display: block;
        padding: 20px;
        background: white;
        border: 1px solid #D2B48C;
        border-radius: 10px;
        color: #654321;
        text-decoration: none;
    }

    .note-recto {
        font-weight: bold;
        font-size: 18px;
    }

    .note-verso {
        margin-top: 10px;
    }

    .retour {
        display: inline-block;
        margin-bottom: 25px;
        color: #654321;
        text-decoration: none;
    }

    #message {
        text-align: center;
        margin-top: 20px;
    }

    .ajouter {
        display: inline-block;
        padding: 10px 15px;
        margin-bottom: 20px;
        background: #654321;
        color: white;
        border-radius: 8px;
        text-decoration: none;
    }

</style>
<div id="breadcrumb"></div>



<a href="javascript:history.back()"
   class="retour">

    ← Retour

</a>


<!-- ========================================================= -->
<!-- EN-TÊTE -->
<!-- ========================================================= -->

<div class="entete">

    <div
        id="nomMatiere"
        class="matiere">

        📚 Chargement...

    </div>

    <div
        id="nomChapitre"
        class="chapitre">

        📖 Chargement...

    </div>

</div>


<!-- ========================================================= -->
<!-- AJOUTER UNE NOTE -->
<!-- ========================================================= -->

<a
    id="btnAjouterNote"
    href="#"
    class="ajouter">

    ➕ Ajouter une note

</a>


<h2>
    📝 Notes
</h2>


<div id="notes"></div>


<div id="message">
    Chargement...
</div>


<script>

    /*
    |--------------------------------------------------------------------------
    | Récupérer le chapitre dans l'URL
    |--------------------------------------------------------------------------
    */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const chapitreId =
        params.get('id');


    console.log(
        "📖 ID chapitre :",
        chapitreId
    );


    /*
    |--------------------------------------------------------------------------
    | Vérifier l'ID
    |--------------------------------------------------------------------------
    */

    if (!chapitreId) {

        document.getElementById(
            "message"
        ).textContent =
            "❌ Aucun chapitre sélectionné.";

    }


    /*
    |--------------------------------------------------------------------------
    | Lien Ajouter une note
    |--------------------------------------------------------------------------
    */

    document.getElementById(
        "btnAjouterNote"
    ).href =
        "/offlineView/creer-note.html?id=" +
        chapitreId;


    /*
    |--------------------------------------------------------------------------
    | Ouvrir IndexedDB
    |--------------------------------------------------------------------------
    */

    const request =
        indexedDB.open(
            "nafarbox",
            4
        );


    request.onsuccess =
        function (event) {

            const db =
                event.target.result;


            console.log(
                "✅ IndexedDB ouverte"
            );


            /*
            | Charger le chapitre
            */

            chargerChapitre(
                db
            );


            /*
            | Charger les notes
            */

            chargerNotes(
                db
            );

        };


    request.onerror =
        function (event) {

            console.error(
                "❌ Erreur IndexedDB :",
                event.target.error
            );

            document.getElementById(
                "message"
            ).textContent =
                "❌ Impossible d'ouvrir la base locale.";

        };


    /*
    |--------------------------------------------------------------------------
    | Charger le chapitre
    |--------------------------------------------------------------------------
    */

    function chargerChapitre(db)
    {

        const transaction =
            db.transaction(
                "chapitres",
                "readonly"
            );


        const store =
            transaction.objectStore(
                "chapitres"
            );


        const request =
            store.get(
                Number(chapitreId)
            );


        request.onsuccess =
            function ()
            {

                const chapitre =
                    request.result;


                if (!chapitre) {

                    console.error(
                        "❌ Chapitre introuvable :",
                        chapitreId
                    );

                    document.getElementById(
                        "nomChapitre"
                    ).textContent =
                        "📖 Chapitre introuvable";

                    return;

                }


                console.log(
                    "📖 Chapitre trouvé :",
                    chapitre
                );


                /*
                | Afficher le nom du chapitre
                */

                document.getElementById(
                    "nomChapitre"
                ).textContent =
                    "📖 " + chapitre.chapitre;


                /*
                | Charger maintenant la matière
                */

                chargerMatiere(
                    db,
                    chapitre.matiere_id
                );

            };


        request.onerror =
            function (event)
            {

                console.error(
                    "❌ Erreur lecture chapitre :",
                    event.target.error
                );

            };

    }


    /*
    |--------------------------------------------------------------------------
    | Charger la matière
    |--------------------------------------------------------------------------
    */

    function chargerMatiere(
        db,
        matiereId
    )
    {

        const transaction =
            db.transaction(
                "matieres",
                "readonly"
            );


        const store =
            transaction.objectStore(
                "matieres"
            );


        const request =
            store.get(
                Number(matiereId)
            );


        request.onsuccess =
            function ()
            {

                const matiere =
                    request.result;


                if (!matiere) {

                    console.error(
                        "❌ Matière introuvable :",
                        matiereId
                    );

                    document.getElementById(
                        "nomMatiere"
                    ).textContent =
                        "📚 Matière introuvable";

                    return;

                }


                console.log(
                    "📚 Matière trouvée :",
                    matiere
                );


                document.getElementById(
                    "nomMatiere"
                ).textContent =
                    "📚 " + matiere.matiere;

            };


        request.onerror =
            function (event)
            {

                console.error(
                    "❌ Erreur lecture matière :",
                    event.target.error
                );

            };

    }


    /*
    |--------------------------------------------------------------------------
    | Charger les notes du chapitre
    |--------------------------------------------------------------------------
    */

    function chargerNotes(db)
    {

        const transaction =
            db.transaction(
                "notes",
                "readonly"
            );


        const store =
            transaction.objectStore(
                "notes"
            );


        const index =
            store.index(
                "chapitre_id"
            );


        const request =
            index.getAll(
                Number(chapitreId)
            );


        request.onsuccess =
            function ()
            {

                const notes =
                    request.result;


                console.log(
                    "📝 Notes trouvées :",
                    notes
                );


                afficherNotes(
                    notes
                );

            };


        request.onerror =
            function (event)
            {

                console.error(
                    "❌ Erreur lecture notes :",
                    event.target.error
                );

            };

    }


    /*
    |--------------------------------------------------------------------------
    | Afficher les notes
    |--------------------------------------------------------------------------
    */

    function afficherNotes(notes)
    {

        const container =
            document.getElementById(
                "notes"
            );


        const message =
            document.getElementById(
                "message"
            );


        container.innerHTML = "";


        if (notes.length === 0) {

            message.textContent =
                "Aucune note disponible hors connexion.";

            return;

        }


        message.textContent =
            notes.length +
            " note(s) disponible(s).";


        notes.forEach(
            function (note)
            {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "note";


                div.innerHTML = `

                    <div class="note-recto">
                        ${note.recto}
                    </div>

                    <div class="note-verso">
                        ${note.verso}
                    </div>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }

</script>
<script>

fetch("/offlineView/breadcrumb.html")
    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Erreur HTTP : " + response.status
            );
        }

        return response.text();

    })
    .then(html => {

        document.getElementById(
            "breadcrumb"
        ).innerHTML = html;

        chargerBreadcrumb();

    })
    .catch(error => {

        console.error(
            "❌ Erreur breadcrumb :",
            error
        );

    });


function chargerBreadcrumb() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const chapitreId =
        params.get("id");


    if (!chapitreId) {

        console.error(
            "❌ ID chapitre absent"
        );

        return;
    }


    const request =
        indexedDB.open(
            "nafarbox",
            4
        );


    request.onsuccess =
        function(event) {

            const db =
                event.target.result;


            /*
            |--------------------------------------------------------------------------
            | Récupérer le chapitre
            |--------------------------------------------------------------------------
            */

            const transaction =
                db.transaction(
                    "chapitres",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "chapitres"
                );


            const chapitreRequest =
                store.get(
                    Number(chapitreId)
                );


            chapitreRequest.onsuccess =
                function() {

                    const chapitre =
                        chapitreRequest.result;


                    if (!chapitre) {

                        console.error(
                            "❌ Chapitre introuvable"
                        );

                        return;
                    }


                    console.log(
                        "📖 Chapitre :",
                        chapitre
                    );


                    /*
                    |--------------------------------------------------------------------------
                    | Nom du chapitre
                    |--------------------------------------------------------------------------
                    */

                    document.getElementById(
                        "breadcrumbChapitre"
                    ).textContent =
                        "📖 " + chapitre.chapitre;


                    /*
                    |--------------------------------------------------------------------------
                    | Lien vers le chapitre
                    |--------------------------------------------------------------------------
                    */

                    document.getElementById(
                        "breadcrumbChapitre"
                    ).href =
                        "/offlineView/notes.html?id=" +
                        chapitre.id;


                    /*
                    |--------------------------------------------------------------------------
                    | Récupérer la matière
                    |--------------------------------------------------------------------------
                    */

                    chargerBreadcrumbMatiere(
                        db,
                        chapitre.matiere_id
                    );

                };

        };

}


function chargerBreadcrumbMatiere(
    db,
    matiereId
) {

    const transaction =
        db.transaction(
            "matieres",
            "readonly"
        );


    const store =
        transaction.objectStore(
            "matieres"
        );


    const request =
        store.get(
            Number(matiereId)
        );


    request.onsuccess =
        function() {

            const matiere =
                request.result;


            if (!matiere) {

                console.error(
                    "❌ Matière introuvable"
                );

                return;
            }


            console.log(
                "📚 Matière :",
                matiere
            );


            /*
            |--------------------------------------------------------------------------
            | Nom réel de la matière
            |--------------------------------------------------------------------------
            */

            document.getElementById(
                "breadcrumbMatiere"
            ).textContent =
                "📚 " + matiere.matiere;


            /*
            |--------------------------------------------------------------------------
            | Lien vers les chapitres de la matière
            |--------------------------------------------------------------------------
            */

            document.getElementById(
                "breadcrumbMatiere"
            ).href =
                "/offlineView/chapitres.html?id=" +
                matiere.id;

        };

}

</script>
